
<!DOCTYPE html>
<html>
<head>
    <title>Update Patient Name</title>
</head>
<body>

    <h1>Update Patient Name</h1>

    <form method="POST">
        <label>Patient ID:</label>
        <input type="number" name="patient_id" required>
        <br><br>

        <label>New Patient Name:</label>
        <input type="text" name="new_name" required>
        <br><br>

        <button type="submit">Update Name</button>
    </form>

    <p>{{ message }}</p>

    <a href="/patients">View Patients</a>
    <br><br>
    <a href="/">Home</a>

</body>
</html>
