<!DOCTYPE html>
<html>
<head>
    <title>Update Patient</title>
</head>
<body>

    <h1>Update Patient Age</h1>

    <form method="POST">

        <label>Patient ID:</label>
        <input type="number" name="patient_id" min="1" required>
        <br><br>

        <label>New Age:</label>
        <input type="number" name="age" min="0" required>
        <br><br>

        <button type="submit">Update Age</button>

    </form>

    <p>{{ message }}</p>

    <a href="/">Home</a>

</body>
</html>
