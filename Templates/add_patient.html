```html
<!DOCTYPE html>
<html>
<head>
    <title>Add Patient</title>
</head>
<body>

    <h2>Add New Patient</h2>

    <form method="POST">

        <label>Patient Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Age:</label>
        <input type="number" name="age" min="0" required>
        <br><br>

        <label>Gender:</label>
        <select name="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <label>City:</label>
        <input type="text" name="city" required>
        <br><br>

        <h3>Hospital Visit Details</h3>

        <label>Disease:</label>
        <input type="text" name="disease" required>
        <br><br>

        <label>Admission Date:</label>
        <input type="date" name="admission_date" required>
        <br><br>

        <label>Discharge Date:</label>
        <input type="date" name="discharge_date">
        <br><br>

        <label>Treatment Cost:</label>
        <input type="number" name="treatment_cost"
               min="0" step="0.01" required>
        <br><br>

        <button type="submit">Add Patient and Visit</button>

    </form>

    <br>
    <a href="/">Back to Home</a>

</body>
</html>
```
